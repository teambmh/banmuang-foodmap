<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>บ้านม่วง FoodMap</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <div class="badge">Google Sheet Database • GitHub Pages</div>
        <h1>🍜 บ้านม่วง FoodMap</h1>
        <p>แผนที่ปักหมุดร้านอาหาร คาเฟ่ ร้านกาแฟ และร้านแนะนำในอำเภอบ้านม่วง</p>
      </div>
      <button id="installBtn" class="ghost hidden">ติดตั้งแอป</button>
    </header>

    <section class="panel toolbar">
      <div class="searchbox">
        <input id="q" type="search" placeholder="ค้นหาชื่อร้าน / ประเภท / เมนู เช่น กาแฟ ก๋วยเตี๋ยว หมูกระทะ">
        <button id="clearBtn" class="secondary">ล้าง</button>
      </div>

      <div class="grid">
        <label>หมวดหมู่
          <select id="category">
            <option value="">ทั้งหมด</option>
            <option value="ร้านอาหาร">🍛 ร้านอาหาร</option>
            <option value="คาเฟ่">☕ คาเฟ่</option>
            <option value="ร้านกาแฟ">🥤 ร้านกาแฟ</option>
            <option value="หมูกระทะ">🥩 หมูกระทะ</option>
            <option value="ของหวาน">🍧 ของหวาน</option>
            <option value="ร้านค้า">🛒 ร้านค้า</option>
          </select>
        </label>

        <label>เรียงลำดับ
          <select id="sort">
            <option value="name">ชื่อร้าน</option>
            <option value="category">หมวดหมู่</option>
          </select>
        </label>
      </div>

      <div class="row">
        <button id="homeBtn" class="primary">🏠 กลับจุดกลางบ้านม่วง</button>
        <button id="locateBtn" class="secondary">📍 ตำแหน่งฉัน</button>
        <a id="sheetBtn" class="sheet-link" target="_blank" href="#">✏️ แก้ไขข้อมูลร้านใน Google Sheet</a>
      </div>

      <div id="status" class="status">กำลังโหลดข้อมูลร้าน...</div>
    </section>

    <main class="layout">
      <section class="map-card">
        <div id="map"></div>
      </section>

      <section class="results-card">
        <div class="results-head">
          <h2>รายการร้าน</h2>
          <span id="count">0 ร้าน</span>
        </div>
        <div id="results" class="results"></div>
      </section>
    </main>

    <footer>
      วิธีแก้ไขข้อมูล: เปิด Google Sheet → เพิ่มแถวร้าน → ใส่ lat/lng → เว็บจะอัปเดตตามข้อมูลใน Sheet
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./js/app.js?v=sheet1"></script>
</body>
</html>
